<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>杨欣媛 ❤</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(ellipse at center, #1a0a1a 0%, #0a0010 60%, #000 100%);
    font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
    cursor: default;
    touch-action: manipulation;
  }

  canvas#particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .main-container {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 20px;
  }

  .heart-wrapper {
    position: relative;
    animation: floatHeart 3s ease-in-out infinite;
  }

  @keyframes floatHeart {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-14px); }
  }

  .heart-glow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(300px, 70vw);
    height: min(300px, 70vw);
    background: radial-gradient(circle, rgba(255, 80, 130, 0.4) 0%, transparent 70%);
    border-radius: 50%;
    animation: glowPulse 2s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes glowPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
    50% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
  }

  .heart-svg {
    width: min(280px, 72vw);
    height: auto;
    filter: drop-shadow(0 0 20px rgba(255, 60, 110, 0.55));
    animation: heartBeat 1.2s ease-in-out infinite;
    position: relative;
    z-index: 2;
  }

  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.1); }
    30% { transform: scale(1); }
    45% { transform: scale(1.1); }
    60% { transform: scale(1); }
  }

  .name-container {
    position: absolute;
    top: 48%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
    text-align: center;
    pointer-events: none;
    width: 100%;
  }

  .name-text {
    display: inline-block;
    font-size: min(36px, 9vw);
    font-weight: 700;
    background: linear-gradient(135deg, #fff5f5 0%, #ffccd5 40%, #fff0f3 70%, #ffe0e6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 4px;
    animation: textShimmer 3s ease-in-out infinite;
    white-space: nowrap;
  }

  @keyframes textShimmer {
    0%, 100% { filter: drop-shadow(0 0 6px rgba(255,255,255,0.35)); }
    50% { filter: drop-shadow(0 0 16px rgba(255,180,200,0.8)); }
  }

  .subtitle {
    color: rgba(255, 200, 220, 0.85);
    font-size: min(15px, 4vw);
    letter-spacing: 6px;
    animation: fadeInOut 3s ease-in-out infinite;
  }

  @keyframes fadeInOut {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .floating-hearts {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .small-heart {
    position: absolute;
    animation: rise linear infinite;
    opacity: 0;
    will-change: transform;
  }

  @keyframes rise {
    0%   { transform: translateY(105vh) scale(0) rotate(0deg); opacity: 0; }
    8%   { opacity: 0.7; }
    85%  { opacity: 0.25; }
    100% { transform: translateY(-10vh) scale(1.1) rotate(360deg); opacity: 0; }
  }

  .ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border: 2px solid rgba(255, 120, 160, 0.3);
    border-radius: 50%;
    animation: ringExpand 3s ease-out infinite;
    pointer-events: none;
  }

  @keyframes ringExpand {
    0%   { width: 160px; height: 160px; opacity: 0.6; }
    100% { width: 420px; height: 420px; opacity: 0; }
  }

  .ring:nth-child(2) { animation-delay: 1s; }
  .ring:nth-child(3) { animation-delay: 2s; }

  @media (max-width: 480px) {
    .ring { display: none; }
  }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="floating-hearts" id="floatingHearts"></div>

<div class="ring"></div>
<div class="ring"></div>
<div class="ring"></div>

<div class="main-container">
  <div class="heart-wrapper">
    <div class="heart-glow"></div>
    <svg class="heart-svg" viewBox="0 0 100 92" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff2d6d" />
          <stop offset="100%" stop-color="#ff6b9d" />
        </linearGradient>
        <filter id="innerGlow">
          <feGaussianBlur in="SourceGraphic" stdDeviation="0.6" />
        </filter>
      </defs>
      <path d="M50 88
               C50 88, 6 56, 6 30
               C6 10, 22 -2, 36 8
               C42 13, 50 26, 50 26
               C50 26, 58 13, 64 8
               C78 -2, 94 10, 94 30
               C94 56, 50 88, 50 88Z"
            fill="url(#heartGrad)"
            stroke="rgba(255,255,255,0.25)"
            stroke-width="0.5"
            filter="url(#innerGlow)" />
    </svg>
    <div class="name-container">
      <span class="name-text">杨欣媛</span>
    </div>
  </div>
  <p class="subtitle">永 远 爱 你</p>
</div>

<script>
(function() {
  var canvas = document.getElementById('particles');
  var ctx = canvas.getContext('2d');
  var particles = [];
  var isMobile = window.innerWidth < 768;
  var particleCount = isMobile ? 50 : 120;

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', function() {
    resize();
    isMobile = window.innerWidth < 768;
    particleCount = isMobile ? 50 : 120;
    while (particles.length > particleCount) particles.pop();
    while (particles.length < particleCount) particles.push(new Particle());
  });
  resize();

  function Particle() {
    this.reset();
    this.y = Math.random() * canvas.height;
  }
  Particle.prototype.reset = function() {
    this.x = Math.random() * canvas.width;
    this.y = canvas.height + 10;
    this.size = Math.random() * 2.5 + 1;
    this.speed = Math.random() * 0.8 + 0.3;
    this.opacity = Math.random() * 0.6 + 0.2;
    this.drift = Math.random() * 0.4 - 0.2;
    this.color = Math.random() < 0.7
      ? 'rgba(255,' + Math.floor(100 + Math.random() * 100) + ',' + Math.floor(140 + Math.random() * 80) + ','
      : 'rgba(255,' + Math.floor(200 + Math.random() * 55) + ',' + Math.floor(200 + Math.random() * 55) + ',';
  };
  Particle.prototype.update = function() {
    this.y -= this.speed;
    this.x += this.drift + Math.sin(this.y * 0.02) * 0.3;
    if (this.y < -10) this.reset();
  };
  Particle.prototype.draw = function() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = this.color + this.opacity + ')';
    ctx.fill();
  };

  for (var i = 0; i < particleCount; i++) {
    particles.push(new Particle());
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = 0; i < particles.length; i++) {
      particles[i].update();
      particles[i].draw();
    }
    requestAnimationFrame(animate);
  }
  animate();

  // Floating hearts
  var container = document.getElementById('floatingHearts');
  var emojis = ['💕','💖','💗','💝','✨','💫','🌸','🩷'];

  function createHeart() {
    var el = document.createElement('span');
    el.className = 'small-heart';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    el.style.left = Math.random() * 100 + '%';
    el.style.fontSize = (Math.random() * 18 + 12) + 'px';
    el.style.animationDuration = (Math.random() * 8 + 6) + 's';
    container.appendChild(el);
    el.addEventListener('animationend', function() { el.remove(); });
  }

  // Slower interval on mobile to save battery
  var interval = isMobile ? 700 : 400;
  setInterval(createHeart, interval);

  for (var j = 0; j < 8; j++) {
    setTimeout(createHeart, j * 600);
  }
})();
</script>

</body>
</html>
