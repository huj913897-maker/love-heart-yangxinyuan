<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>杨欣媛 ❤</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(ellipse at center, #1a0a1a 0%, #0a0010 60%, #000 100%);
    overflow: hidden;
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
    cursor: default;
  }

  canvas#particles {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .main-container {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  /* Heart SVG */
  .heart-wrapper {
    position: relative;
    animation: floatHeart 3s ease-in-out infinite;
  }

  @keyframes floatHeart {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-18px); }
  }

  .heart-glow {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 340px;
    height: 340px;
    background: radial-gradient(circle, rgba(255, 80, 130, 0.35) 0%, transparent 70%);
    border-radius: 50%;
    animation: glowPulse 2s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes glowPulse {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
    50% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
  }

  .heart-svg {
    width: 320px;
    height: 300px;
    filter: drop-shadow(0 0 25px rgba(255, 60, 110, 0.6));
    animation: heartBeat 1.2s ease-in-out infinite;
    position: relative;
    z-index: 2;
  }

  @keyframes heartBeat {
    0%, 100% { transform: scale(1); }
    14% { transform: scale(1.12); }
    28% { transform: scale(1); }
    42% { transform: scale(1.12); }
    56% { transform: scale(1); }
  }

  /* Gradient heart fill */
  .heart-gradient-start {
    stop-color: #ff2d6d;
  }
  .heart-gradient-end {
    stop-color: #ff6b9d;
  }

  .name-container {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
    text-align: center;
    pointer-events: none;
    animation: nameShine 2.5s ease-in-out infinite;
  }

  @keyframes nameShine {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.3); }
  }

  .name-text {
    font-size: 38px;
    font-weight: 700;
    background: linear-gradient(135deg, #fff5f5, #ffccd5, #fff0f3, #ffe0e6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    letter-spacing: 3px;
    animation: textShimmer 3s ease-in-out infinite;
  }

  @keyframes textShimmer {
    0%, 100% { filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.4)); }
    50% { filter: drop-shadow(0 0 14px rgba(255, 180, 200, 0.8)); }
  }

  /* Subtitle */
  .subtitle {
    color: rgba(255, 200, 220, 0.8);
    font-size: 16px;
    letter-spacing: 6px;
    animation: fadeInOut 3s ease-in-out infinite;
  }

  @keyframes fadeInOut {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  /* Floating small hearts */
  .floating-hearts {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .small-heart {
    position: absolute;
    animation: rise linear infinite;
    opacity: 0;
    font-size: 20px;
  }

  @keyframes rise {
    0% {
      transform: translateY(100vh) scale(0) rotate(0deg);
      opacity: 0;
    }
    10% {
      opacity: 0.8;
    }
    90% {
      opacity: 0.3;
    }
    100% {
      transform: translateY(-10vh) scale(1.2) rotate(360deg);
      opacity: 0;
    }
  }

  /* Sparkle rings */
  .ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border: 2px solid rgba(255, 120, 160, 0.3);
    border-radius: 50%;
    animation: ringExpand 3s ease-out infinite;
    pointer-events: none;
  }

  @keyframes ringExpand {
    0% { width: 200px; height: 200px; opacity: 0.7; }
    100% { width: 500px; height: 500px; opacity: 0; }
  }

  .ring:nth-child(2) { animation-delay: 1s; }
  .ring:nth-child(3) { animation-delay: 2s; }
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="floating-hearts" id="floatingHearts"></div>

<div class="ring"></div>
<div class="ring"></div>
<div class="ring"></div>

<div class="main-container">
  <div class="heart-wrapper">
    <div class="heart-glow"></div>
    <svg class="heart-svg" viewBox="0 0 100 92" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" class="heart-gradient-start" />
          <stop offset="100%" class="heart-gradient-end" />
        </linearGradient>
        <filter id="innerGlow">
          <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" />
        </filter>
      </defs>
      <path d="M50 88
               C50 88, 6 56, 6 30
               C6 10, 22 -2, 36 8
               C42 13, 50 26, 50 26
               C50 26, 58 13, 64 8
               C78 -2, 94 10, 94 30
               C94 56, 50 88, 50 88Z"
            fill="url(#heartGrad)"
            stroke="rgba(255,255,255,0.3)"
            stroke-width="0.5"
            filter="url(#innerGlow)" />
    </svg>
    <div class="name-container">
      <span class="name-text">杨欣媛</span>
    </div>
  </div>
  <p class="subtitle">永 远 爱 你</p>
</div>

<script>
  // Canvas particles
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  class Particle {
    constructor() {
      this.reset();
      this.y = Math.random() * canvas.height;
    }
    reset() {
      this.x = Math.random() * canvas.width;
      this.y = canvas.height + 10;
      this.size = Math.random() * 2.5 + 1;
      this.speed = Math.random() * 0.8 + 0.3;
      this.opacity = Math.random() * 0.6 + 0.2;
      this.drift = Math.random() * 0.4 - 0.2;
      this.color = Math.random() < 0.7
        ? `rgba(255, ${100 + Math.random() * 100}, ${140 + Math.random() * 80}, `
        : `rgba(255, ${200 + Math.random() * 55}, ${200 + Math.random() * 55}, `;
    }
    update() {
      this.y -= this.speed;
      this.x += this.drift + Math.sin(this.y * 0.02) * 0.3;
      if (this.y < -10) this.reset();
    }
    draw() {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fillStyle = this.color + this.opacity + ')';
      ctx.fill();
    }
  }

  for (let i = 0; i < 120; i++) {
    particles.push(new Particle());
  }

  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animateParticles);
  }
  animateParticles();

  // Floating small hearts
  const container = document.getElementById('floatingHearts');
  const heartEmojis = ['💕', '💖', '💗', '💝', '✨', '💫', '🌸', '🩷'];

  function createFloatingHeart() {
    const el = document.createElement('span');
    el.className = 'small-heart';
    el.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
    el.style.left = Math.random() * 100 + '%';
    el.style.fontSize = (Math.random() * 20 + 14) + 'px';
    el.style.animationDuration = (Math.random() * 8 + 6) + 's';
    container.appendChild(el);

    el.addEventListener('animationend', () => el.remove());
  }

  setInterval(createFloatingHeart, 400);
  for (let i = 0; i < 12; i++) {
    setTimeout(createFloatingHeart, i * 500);
  }
</script>

</body>
</html>
